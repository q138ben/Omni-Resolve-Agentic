steps:
  # Step 1: Install dependencies and run tests
  - name: 'python:3.10-slim'
    id: 'Run Tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install -r requirements.txt
        pytest tests/

  # Step 2: Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Image'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/omni-resolve-agentic:$COMMIT_SHA', '.']

  # Step 3: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args: ['push', 'gcr.io/$PROJECT_ID/omni-resolve-agentic:$COMMIT_SHA']

  # Step 4: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'omni-resolve-agentic'
      - '--image'
      - 'gcr.io/$PROJECT_ID/omni-resolve-agentic:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=us-central1,GOOGLE_GENAI_USE_VERTEXAI=TRUE'

images:
  - 'gcr.io/$PROJECT_ID/omni-resolve-agentic:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
